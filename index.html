<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Au BouBou de Lulu — Clients</title>
<style>
  :root{
    --cream:#FBF7F0;
    --ink:#2B2A28;
    --ink-soft:#6B6560;
    --sage:#5F8B7A;
    --sage-dark:#436B5C;
    --apricot:#E2984B;
    --blush:#F1DCC9;
    --line:#E4DACB;
    --white:#FFFFFF;
    --radius:16px;
  }

  *{ box-sizing:border-box; }

  body{
    margin:0;
    background:var(--cream);
    color:var(--ink);
    font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    -webkit-font-smoothing:antialiased;
    padding-bottom:60px;
  }

  header{
    background:var(--sage);
    color:var(--white);
    padding:22px 18px 26px;
    border-radius:0 0 24px 24px;
    display:flex;
    align-items:center;
    gap:12px;
  }

  header .paw{ width:34px; height:34px; flex-shrink:0; }

  header h1{
    font-size:1.3rem;
    margin:0;
    font-weight:800;
    letter-spacing:-0.01em;
  }

  header p{
    margin:2px 0 0;
    font-size:0.8rem;
    opacity:0.85;
    font-weight:500;
  }

  main{ max-width:640px; margin:0 auto; padding:16px; }

  .toolbar{
    display:flex;
    gap:8px;
    margin-bottom:14px;
  }

  .search-wrap{
    flex:1;
    position:relative;
  }

  .search-wrap svg{
    position:absolute;
    left:12px;
    top:50%;
    transform:translateY(-50%);
    width:16px;
    height:16px;
    opacity:0.45;
  }

  input, select, textarea{
    font-family:inherit;
    font-size:0.95rem;
    border:1px solid var(--line);
    border-radius:12px;
    padding:11px 12px;
    background:var(--white);
    color:var(--ink);
    width:100%;
  }

  input:focus, select:focus, textarea:focus{
    outline:2px solid var(--apricot);
    outline-offset:1px;
  }

  #search{ padding-left:34px; }

  .btn{
    border:none;
    border-radius:12px;
    padding:11px 16px;
    font-size:0.9rem;
    font-weight:700;
    cursor:pointer;
    white-space:nowrap;
  }

  .btn-primary{ background:var(--apricot); color:var(--white); }
  .btn-primary:active{ background:#C77E33; }

  .btn-ghost{
    background:transparent;
    color:var(--sage-dark);
    border:1px solid var(--sage);
  }

  .btn-small{ padding:8px 12px; font-size:0.82rem; }

  .card{
    background:var(--white);
    border:1px solid var(--line);
    border-radius:var(--radius);
    margin-bottom:10px;
    overflow:hidden;
  }

  .card-head{
    padding:14px 16px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    cursor:pointer;
    gap:10px;
  }

  .card-head .name{ font-weight:700; font-size:1rem; }
  .card-head .meta{ font-size:0.8rem; color:var(--ink-soft); margin-top:2px; }

  .chips{ display:flex; gap:6px; flex-wrap:wrap; margin-top:6px; }

  .chip{
    font-size:0.72rem;
    font-weight:700;
    padding:3px 9px;
    border-radius:999px;
    color:var(--white);
  }

  .chip.chien{ background:var(--sage); }
  .chip.chat{ background:var(--apricot); }
  .chip.autre{ background:#9B9284; }

  .caret{ font-size:0.8rem; color:var(--ink-soft); transition:transform .15s; }
  .card.open .caret{ transform:rotate(180deg); }

  .card-body{
    display:none;
    padding:0 16px 16px;
    border-top:1px solid var(--line);
  }

  .card.open .card-body{ display:block; }

  .field-row{ margin:10px 0 0; }
  .field-row label{
    display:block;
    font-size:0.72rem;
    font-weight:700;
    color:var(--ink-soft);
    text-transform:uppercase;
    letter-spacing:0.03em;
    margin-bottom:4px;
  }

  .field-row .val{ font-size:0.92rem; }

  .section-title{
    font-size:0.78rem;
    font-weight:800;
    color:var(--sage-dark);
    text-transform:uppercase;
    letter-spacing:0.04em;
    margin:16px 0 8px;
    display:flex;
    align-items:center;
    justify-content:space-between;
  }

  .animal-card{
    background:var(--blush);
    border-radius:12px;
    padding:10px 12px;
    margin-bottom:8px;
  }

  .animal-card .a-name{ font-weight:700; font-size:0.92rem; }
  .animal-card .a-meta{ font-size:0.78rem; color:var(--ink-soft); margin-top:2px; }

  .empty{
    text-align:center;
    padding:40px 20px;
    color:var(--ink-soft);
  }

  .empty .paw{ width:40px; height:40px; opacity:0.3; margin-bottom:8px; }

  .modal-overlay{
    display:none;
    position:fixed; inset:0;
    background:rgba(43,42,40,0.45);
    z-index:50;
    align-items:flex-end;
  }

  .modal-overlay.show{ display:flex; }

  .modal{
    background:var(--cream);
    width:100%;
    max-height:88vh;
    overflow-y:auto;
    border-radius:20px 20px 0 0;
    padding:18px 18px 24px;
  }

  .modal h2{
    font-size:1.05rem;
    margin:0 0 14px;
  }

  .modal-actions{
    display:flex;
    gap:10px;
    margin-top:16px;
  }

  .modal-actions .btn{ flex:1; }

  .grid2{ display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .grid3{ display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px; }
  .grid-adresse{ display:grid; grid-template-columns:2fr 1fr 1.3fr; gap:8px; }

  .toast{
    position:fixed;
    bottom:20px;
    left:50%;
    transform:translateX(-50%);
    background:var(--ink);
    color:var(--white);
    padding:10px 18px;
    border-radius:999px;
    font-size:0.85rem;
    opacity:0;
    pointer-events:none;
    transition:opacity .2s;
    z-index:100;
  }

  .toast.show{ opacity:1; }

  .hamburger-btn{
    background:none;
    border:none;
    color:var(--white);
    width:36px;
    height:36px;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    margin-left:auto;
    flex-shrink:0;
  }
  .hamburger-btn svg{ width:24px; height:24px; }

  .nav-overlay{
    display:none;
    position:fixed; inset:0;
    background:rgba(43,42,40,0.45);
    z-index:60;
  }
  .nav-overlay.show{ display:block; }

  .nav-drawer{
    position:fixed;
    top:0; left:0; bottom:0;
    width:75%;
    max-width:280px;
    background:var(--white);
    padding:22px 16px;
    transform:translateX(-100%);
    transition:transform .2s;
  }
  .nav-overlay.show .nav-drawer{ transform:translateX(0); }

  .nav-title{ font-weight:800; font-size:1.05rem; margin-bottom:16px; color:var(--ink-soft); text-transform:uppercase; font-size:0.78rem; letter-spacing:0.04em; }

  .nav-item{
    display:flex;
    align-items:center;
    gap:10px;
    padding:12px 10px;
    border-radius:10px;
    font-weight:700;
    font-size:0.95rem;
    color:var(--ink);
    cursor:pointer;
    margin-bottom:4px;
  }
  .nav-item.active{ background:var(--blush); color:var(--sage-dark); }

  .param-tabs{ display:flex; gap:8px; margin-bottom:14px; flex-wrap:wrap; }
  .tab-btn{
    padding:8px 16px;
    border-radius:999px;
    border:1px solid var(--line);
    background:var(--white);
    font-weight:700;
    font-size:0.85rem;
    color:var(--ink-soft);
    cursor:pointer;
  }
  .tab-btn.active{ background:var(--sage); color:var(--white); border-color:var(--sage); }

  .param-item{
    display:flex;
    align-items:center;
    justify-content:space-between;
    background:var(--white);
    border:1px solid var(--line);
    border-radius:12px;
    padding:10px 14px;
    margin-bottom:8px;
  }
  .param-item .val{ font-weight:700; font-size:0.92rem; }
  .param-item .sub{ font-size:0.78rem; color:var(--ink-soft); margin-top:2px; }

  .btn-delete{
    background:none;
    border:none;
    color:#B0453B;
    font-size:1.1rem;
    cursor:pointer;
    padding:4px 8px;
    line-height:1;
  }

  body.has-bottom-tabs{ padding-bottom:88px; }

  .bottom-tabbar{
    display:none;
    position:fixed;
    bottom:0; left:0; right:0;
    background:var(--white);
    border-top:1px solid var(--line);
    z-index:40;
  }
  .bottom-tabbar.show{ display:flex; }
  .bottom-tabbar button{
    flex:1;
    background:none;
    border:none;
    padding:10px 4px 8px;
    font-size:0.72rem;
    font-weight:700;
    color:var(--ink-soft);
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:2px;
    cursor:pointer;
  }
  .bottom-tabbar button .tab-icon{ font-size:1.2rem; }
  .bottom-tabbar button.active{ color:var(--sage-dark); }

  .client-badge{
    background:var(--blush);
    border-radius:12px;
    padding:10px 14px;
    margin-bottom:14px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    font-weight:700;
    font-size:0.9rem;
  }
  .client-badge .clear-client{
    background:none; border:none; color:var(--sage-dark);
    font-size:0.78rem; font-weight:700; text-decoration:underline; cursor:pointer;
  }

  .cart-panel{
    background:var(--white);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:14px 16px;
    margin-bottom:14px;
  }
  .cart-item{
    display:flex;
    align-items:center;
    gap:8px;
    padding:8px 0;
    border-bottom:1px solid var(--line);
  }
  .cart-item:last-child{ border-bottom:none; }
  .cart-item .libelle{ flex:1; font-weight:700; font-size:0.88rem; }
  .cart-item input.cart-prix{ width:64px; text-align:right; padding:6px 8px; }
  .cart-item input.cart-qte{ width:46px; text-align:center; padding:6px 4px; }

  .cart-total-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    font-weight:800;
    font-size:1.05rem;
    margin-top:10px;
    padding-top:10px;
    border-top:2px solid var(--line);
  }

  .prestation-card{
    background:var(--white);
    border:1px solid var(--line);
    border-radius:12px;
    padding:12px 14px;
    margin-bottom:8px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    cursor:pointer;
  }
  .prestation-card .p-name{ font-weight:700; font-size:0.92rem; }
  .prestation-card .p-price{ font-weight:800; color:var(--sage-dark); font-size:0.9rem; }

  .caisse-client-card{
    background:var(--white);
    border:1px solid var(--line);
    border-radius:12px;
    padding:12px 14px;
    margin-bottom:8px;
    cursor:pointer;
  }
  .caisse-client-card .name{ font-weight:700; font-size:0.92rem; }

  .caisse-total-bar{
    background:var(--sage);
    color:var(--white);
    border-radius:var(--radius);
    padding:12px 18px;
    margin-bottom:14px;
    display:flex;
    justify-content:space-between;
    align-items:center;
  }
  .caisse-total-bar .header-label{ opacity:0.85; margin-bottom:0; }
  .caisse-total-bar .total-value{ font-size:1.4rem; font-weight:800; }

  .caisse-selected-bar{
    background:var(--blush);
    border-radius:12px;
    padding:10px 14px;
    margin-bottom:10px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    font-weight:700;
    font-size:0.9rem;
  }
  .caisse-selected-bar .clear-client{
    background:none; border:none; color:var(--sage-dark);
    font-size:0.75rem; font-weight:700; text-decoration:underline; cursor:pointer;
  }

  .header-label{
    font-size:0.68rem;
    font-weight:800;
    text-transform:uppercase;
    letter-spacing:0.05em;
    opacity:0.65;
  }

  .bottom-tabbar button.btn-encaisser{
    background:var(--apricot);
    color:var(--white);
  }
</style>
</head>
<body>

<header>
  <svg class="paw" viewBox="0 0 64 64" fill="currentColor">
    <ellipse cx="32" cy="42" rx="15" ry="12"/>
    <ellipse cx="14" cy="24" rx="7" ry="9"/>
    <ellipse cx="50" cy="24" rx="7" ry="9"/>
    <ellipse cx="24" cy="12" rx="6" ry="8"/>
    <ellipse cx="40" cy="12" rx="6" ry="8"/>
  </svg>
  <div>
    <h1>Au BouBou de Lulu</h1>
    <p>Fiches clients &amp; compagnons</p>
  </div>
  <button class="hamburger-btn" id="btnMenu" aria-label="Menu">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
  </button>
</header>

<div class="nav-overlay" id="navOverlay">
  <div class="nav-drawer">
    <div class="nav-title">Menu</div>
    <div class="nav-item active" id="navClients" onclick="showView('clients')">🐾 Clients</div>
    <div class="nav-item" id="navCaisse" onclick="showView('caisse')">💶 Caisse</div>
    <div class="nav-item" id="navParametres" onclick="showView('parametres')">⚙️ Paramètres</div>
  </div>
</div>

<main>
  <div id="viewClients">
    <div class="toolbar">
      <div class="search-wrap">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input id="search" type="text" placeholder="Chercher un client...">
      </div>
      <button class="btn btn-primary" id="btnNewClient">+ Client</button>
    </div>

    <div id="clientList"></div>
  </div>

  <div id="viewParametres" style="display:none">
    <div class="param-tabs" id="paramTabs"></div>

    <div class="card" style="padding:14px 16px;margin-bottom:14px;">
      <div class="section-title"><span>Ajouter une valeur</span></div>
      <div class="field-row" id="paramParentRow" style="display:none">
        <label>Espèce</label>
        <select id="paramParentSelect"></select>
      </div>
      <div class="grid2" id="paramValuePriceRow">
        <div class="field-row"><label>Valeur</label><input id="paramValueInput" type="text"></div>
        <div class="field-row" id="paramPriceRow" style="display:none"><label>Prix (€)</label><input id="paramPriceInput" type="number" step="0.5" min="0"></div>
      </div>
      <button class="btn btn-primary" style="width:100%;margin-top:12px;" id="btnAddParam">+ Ajouter</button>
    </div>

    <div id="paramList"></div>
  </div>

  <div id="viewCaisse" style="display:none">
    <div class="caisse-total-bar">
      <span class="header-label">Total</span>
      <span class="total-value" id="cartTotal">0.00 €</span>
    </div>

    <div class="cart-panel">
      <div id="cartItems"></div>
      <div id="cartEmpty" class="meta" style="color:var(--ink-soft);font-size:0.85rem;">Panier vide</div>
    </div>

    <div id="caisseTabClient">
      <div id="caisseSelectedClientBar" class="caisse-selected-bar" style="display:none">
        <span id="caisseSelectedClientName"></span>
        <button class="clear-client" onclick="clearCaisseClient()">changer</button>
      </div>
      <div class="search-wrap" id="caisseClientSearchWrap" style="margin-bottom:10px;">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input id="caisseClientSearch" type="text" placeholder="Chercher un client...">
      </div>
      <div id="caisseClientList"></div>
    </div>

    <div id="caisseTabPrestation" style="display:none">
      <div id="prestationList"></div>
    </div>

    <div id="caisseTabAutre" style="display:none">
      <div class="card" style="padding:14px 16px;">
        <div class="field-row"><label>Libellé</label><input id="autreLibelle" type="text"></div>
        <div class="grid2">
          <div class="field-row"><label>Prix (€)</label><input id="autrePrix" type="number" step="0.5" min="0"></div>
          <div class="field-row"><label>Quantité</label><input id="autreQte" type="number" value="1" min="1"></div>
        </div>
        <button class="btn btn-primary" style="width:100%;margin-top:12px;" id="btnAddAutre">+ Ajouter au panier</button>
      </div>
    </div>
  </div>
</main>

<div class="bottom-tabbar" id="caisseBottomTabs">
  <button class="active" data-tab="client" onclick="selectCaisseTab('client')"><span class="tab-icon">👤</span>Client</button>
  <button data-tab="prestation" onclick="selectCaisseTab('prestation')"><span class="tab-icon">✂️</span>Prestation</button>
  <button data-tab="autre" onclick="selectCaisseTab('autre')"><span class="tab-icon">🛍️</span>Autre</button>
  <button class="btn-encaisser" id="btnEncaisser"><span class="tab-icon">💶</span>Encaisser</button>
</div>

<!-- Modal paiement -->
<div class="modal-overlay" id="overlayPaiement">
  <div class="modal">
    <h2>Encaisser</h2>
    <div class="field-row">
      <label>Total</label>
      <div class="val" id="paiementTotal" style="font-size:1.3rem;font-weight:800;"></div>
    </div>
    <div class="field-row">
      <label>Moyen de paiement</label>
      <select id="paiementMoyen">
        <option value="Especes">Espèces</option>
        <option value="CB">CB</option>
        <option value="Cheque">Chèque</option>
      </select>
    </div>
    <div class="modal-actions">
      <button class="btn btn-ghost" id="btnCancelPaiement">Annuler</button>
      <button class="btn btn-primary" id="btnConfirmPaiement">Valider</button>
    </div>
  </div>
</div>

<!-- Modal nouveau client -->
<div class="modal-overlay" id="overlayClient">
  <div class="modal">
    <h2>Nouveau client</h2>
    <div class="grid3">
      <div class="field-row"><label>Nom *</label><input id="fNom" type="text"></div>
      <div class="field-row"><label>Prénom</label><input id="fPrenom" type="text"></div>
      <div class="field-row"><label>Naissance</label><input id="fDateNaissance" type="date"></div>
    </div>
    <div class="grid2">
      <div class="field-row"><label>Téléphone</label><input id="fTel" type="tel"></div>
      <div class="field-row"><label>Email</label><input id="fEmail" type="email"></div>
    </div>
    <div class="grid-adresse">
      <div class="field-row"><label>Adresse</label><input id="fAdresse" type="text"></div>
      <div class="field-row"><label>Code postal</label><input id="fCodePostal" type="text" inputmode="numeric" maxlength="5"></div>
      <div class="field-row"><label>Commune</label><input id="fCommune" type="text"></div>
    </div>
    <div class="field-row"><label>Notes</label><textarea id="fNotes" rows="2"></textarea></div>
    <div class="modal-actions">
      <button class="btn btn-ghost" id="btnCancelClient">Annuler</button>
      <button class="btn btn-primary" id="btnSaveClient">Enregistrer</button>
    </div>
  </div>
</div>

<!-- Modal nouvel animal -->
<div class="modal-overlay" id="overlayAnimal">
  <div class="modal">
    <h2>Nouvel animal</h2>
    <input type="hidden" id="aClientId">
    <div class="field-row"><label>Nom *</label><input id="aNom" type="text"></div>
    <div class="grid2">
      <div class="field-row"><label>Espèce *</label><select id="aEspece"></select></div>
      <div class="field-row"><label>Race</label><select id="aRace"></select></div>
    </div>
    <div class="grid2">
      <div class="field-row"><label>Taille</label><select id="aTaille"></select></div>
      <div class="field-row"><label>Poids (kg)</label><input id="aPoids" type="number" step="0.1"></div>
    </div>
    <div class="field-row"><label>Date de naissance</label><input id="aDateNaissance" type="date"></div>
    <div class="field-row"><label>Notes santé</label><textarea id="aNotes" rows="2"></textarea></div>
    <div class="modal-actions">
      <button class="btn btn-ghost" id="btnCancelAnimal">Annuler</button>
      <button class="btn btn-primary" id="btnSaveAnimal">Enregistrer</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const API_URL = 'https://script.google.com/macros/s/AKfycbwAub-4OtWsI6pPboX4RafkHg365sdRMKw_732ZnQThlXPr74iRfEt-vwTeSo160BQl/exec';

let clients = [];
let animauxParClient = {};
let parametres = [];

// ---------- API helpers ----------
async function apiGet(action, params){
  params = params || {};
  const qs = new URLSearchParams({action, ...params}).toString();
  const res = await fetch(`${API_URL}?${qs}`);
  return res.json();
}

async function apiPost(action, data){
  const res = await fetch(API_URL, {
    method:'POST',
    headers:{'Content-Type':'text/plain;charset=utf-8'},
    body: JSON.stringify({action, data})
  });
  return res.json();
}

function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 2200);
}

// ---------- Chargement initial ----------
async function loadAll(){
  const [c, a, p] = await Promise.all([
    apiGet('getClients'),
    apiGet('getAnimaux'),
    apiGet('getParametres')
  ]);

  clients = c || [];
  parametres = p || [];

  animauxParClient = {};
  (a || []).forEach(an => {
    if (!animauxParClient[an.ID_Client]) animauxParClient[an.ID_Client] = [];
    animauxParClient[an.ID_Client].push(an);
  });

  renderClientList(clients);
}

function especeChipClass(esp){
  if (esp === 'Chien') return 'chien';
  if (esp === 'Chat') return 'chat';
  return 'autre';
}

function formatDateFR(dateStr){
  if (!dateStr) return '';
  const match = String(dateStr).match(/^(\d{4})-(\d{2})-(\d{2})/);
  if (match) return `${match[3]}/${match[2]}/${match[1]}`;
  return dateStr;
}

// ---------- Rendu liste clients ----------
function renderClientList(list){
  const container = document.getElementById('clientList');

  if (!list.length){
    container.innerHTML = `
      <div class="empty">
        <svg class="paw" viewBox="0 0 64 64" fill="currentColor" style="display:block;margin:0 auto 8px">
          <ellipse cx="32" cy="42" rx="15" ry="12"/><ellipse cx="14" cy="24" rx="7" ry="9"/>
          <ellipse cx="50" cy="24" rx="7" ry="9"/><ellipse cx="24" cy="12" rx="6" ry="8"/><ellipse cx="40" cy="12" rx="6" ry="8"/>
        </svg>
        Aucun client pour le moment.<br>Ajoute le premier avec le bouton "+ Client".
      </div>`;
    return;
  }

  container.innerHTML = list.map(cl => {
    const animaux = animauxParClient[cl.ID_Client] || [];
    const chips = animaux.map(a => `<span class="chip ${especeChipClass(a.Espece)}">${a.Nom_Animal}</span>`).join('');

    return `
    <div class="card" id="card-${cl.ID_Client}">
      <div class="card-head" onclick="toggleCard('${cl.ID_Client}')">
        <div>
          <div class="name">${cl.Prenom || ''} ${cl.Nom || ''}</div>
          <div class="meta">${cl.Telephone || 'Pas de téléphone'}</div>
          <div class="chips">${chips || '<span class="meta">Aucun animal</span>'}</div>
        </div>
        <div class="caret">▾</div>
      </div>
      <div class="card-body" id="body-${cl.ID_Client}"></div>
    </div>`;
  }).join('');
}

function toggleCard(idClient){
  const card = document.getElementById(`card-${idClient}`);
  const wasOpen = card.classList.contains('open');

  document.querySelectorAll('.card.open').forEach(c => c.classList.remove('open'));

  if (!wasOpen){
    card.classList.add('open');
    renderCardBody(idClient);
  }
}

function renderCardBody(idClient){
  const cl = clients.find(c => c.ID_Client === idClient);
  const animaux = animauxParClient[idClient] || [];
  const body = document.getElementById(`body-${idClient}`);

  const adresseComplete = [cl.Adresse, [cl.Code_Postal, cl.Commune].filter(Boolean).join(' ')].filter(Boolean).join(', ');

  body.innerHTML = `
    ${cl.Email ? `<div class="field-row"><label>Email</label><div class="val">${cl.Email}</div></div>` : ''}
    ${cl.Date_Naissance ? `<div class="field-row"><label>Date de naissance</label><div class="val">${formatDateFR(cl.Date_Naissance)}</div></div>` : ''}
    ${adresseComplete ? `<div class="field-row"><label>Adresse</label><div class="val">${adresseComplete}</div></div>` : ''}
    ${cl.Notes ? `<div class="field-row"><label>Notes</label><div class="val">${cl.Notes}</div></div>` : ''}

    <div class="section-title">
      <span>Animaux</span>
      <button class="btn btn-ghost btn-small" onclick="openAnimalModal('${idClient}')">+ Animal</button>
    </div>

    ${animaux.length ? animaux.map(a => `
      <div class="animal-card">
        <div style="display:flex;align-items:flex-start;justify-content:space-between;">
          <div>
            <div class="a-name">${a.Nom_Animal} <span class="chip ${especeChipClass(a.Espece)}">${a.Espece}</span></div>
            <div class="a-meta">${[a.Race, a.Taille, a.Poids ? a.Poids + ' kg' : ''].filter(Boolean).join(' · ')}</div>
            ${a.Notes_Sante ? `<div class="a-meta">⚕ ${a.Notes_Sante}</div>` : ''}
          </div>
          <button class="btn-delete" onclick="deleteAnimalItem('${a.ID_Animal}', '${idClient}')">✕</button>
        </div>
      </div>
    `).join('') : '<div class="meta" style="color:var(--ink-soft);font-size:0.85rem;">Aucun animal enregistré.</div>'}
  `;
}

// ---------- Modal client ----------
function openClientModal(){
  ['fNom','fPrenom','fTel','fEmail','fDateNaissance','fAdresse','fCodePostal','fCommune','fNotes'].forEach(id => document.getElementById(id).value = '');
  document.getElementById('overlayClient').classList.add('show');
}
function closeClientModal(){
  document.getElementById('overlayClient').classList.remove('show');
}

async function saveClient(){
  const Nom = document.getElementById('fNom').value.trim();
  if (!Nom){ toast('Le nom est obligatoire'); return; }

  const data = {
    Nom,
    Prenom: document.getElementById('fPrenom').value.trim(),
    Telephone: document.getElementById('fTel').value.trim(),
    Email: document.getElementById('fEmail').value.trim(),
    Date_Naissance: document.getElementById('fDateNaissance').value,
    Adresse: document.getElementById('fAdresse').value.trim(),
    Code_Postal: document.getElementById('fCodePostal').value.trim(),
    Commune: document.getElementById('fCommune').value.trim(),
    Notes: document.getElementById('fNotes').value.trim()
  };

  toast('Enregistrement...');
  const res = await apiPost('addClient', data);
  if (res.error){ toast('Erreur : ' + res.error); return; }

  closeClientModal();
  toast('Client ajouté ✓');
  await loadAll();
}

// ---------- Modal animal ----------
function fillSelect(select, values, placeholder){
  select.innerHTML = (placeholder ? `<option value="">${placeholder}</option>` : '') +
    values.map(v => `<option value="${v}">${v}</option>`).join('');
}

function refreshRaceOptions(){
  const espece = document.getElementById('aEspece').value;
  const races = parametres
    .filter(p => p.Type === 'Race' && (!espece || p.Parent === espece))
    .map(p => p.Valeur);
  fillSelect(document.getElementById('aRace'), races, 'Sélectionner');
}

function openAnimalModal(idClient){
  document.getElementById('aClientId').value = idClient;
  ['aNom','aPoids','aDateNaissance','aNotes'].forEach(id => document.getElementById(id).value = '');

  const especes = parametres.filter(p => p.Type === 'Espece').map(p => p.Valeur);
  const tailles = parametres.filter(p => p.Type === 'Taille').map(p => p.Valeur);

  fillSelect(document.getElementById('aEspece'), especes, 'Sélectionner');
  fillSelect(document.getElementById('aTaille'), tailles, 'Sélectionner');
  refreshRaceOptions();

  document.getElementById('overlayAnimal').classList.add('show');
}
function closeAnimalModal(){
  document.getElementById('overlayAnimal').classList.remove('show');
}

async function saveAnimal(){
  const Nom_Animal = document.getElementById('aNom').value.trim();
  const Espece = document.getElementById('aEspece').value;
  if (!Nom_Animal || !Espece){ toast('Nom et espèce obligatoires'); return; }

  const data = {
    ID_Client: document.getElementById('aClientId').value,
    Nom_Animal,
    Espece,
    Race: document.getElementById('aRace').value,
    Taille: document.getElementById('aTaille').value,
    Poids: document.getElementById('aPoids').value,
    Date_Naissance: document.getElementById('aDateNaissance').value,
    Notes_Sante: document.getElementById('aNotes').value.trim()
  };

  toast('Enregistrement...');
  const res = await apiPost('addAnimal', data);
  if (res.error){ toast('Erreur : ' + res.error); return; }

  closeAnimalModal();
  toast('Animal ajouté ✓');
  const idClient = data.ID_Client;
  await loadAll();
  document.getElementById(`card-${idClient}`).classList.add('open');
  renderCardBody(idClient);
}

async function deleteAnimalItem(idAnimal, idClient){
  if (!confirm('Supprimer cet animal ?')) return;

  toast('Suppression...');
  const res = await apiPost('deleteAnimal', { ID_Animal: idAnimal });
  if (res.error){ toast('Erreur : ' + res.error); return; }

  toast('Supprimé ✓');
  await loadAll();
  document.getElementById(`card-${idClient}`).classList.add('open');
  renderCardBody(idClient);
}

// ---------- Recherche ----------
document.getElementById('search').addEventListener('input', (e) => {
  const q = e.target.value.trim().toLowerCase();
  if (!q){ renderClientList(clients); return; }
  const filtered = clients.filter(c =>
    (c.Nom || '').toLowerCase().includes(q) ||
    (c.Prenom || '').toLowerCase().includes(q) ||
    (c.Telephone || '').toLowerCase().includes(q) ||
    (c.Commune || '').toLowerCase().includes(q)
  );
  renderClientList(filtered);
});

// ---------- Navigation menu ----------
function openNav(){ document.getElementById('navOverlay').classList.add('show'); }
function closeNav(){ document.getElementById('navOverlay').classList.remove('show'); }

function showView(view){
  document.getElementById('viewClients').style.display = view === 'clients' ? '' : 'none';
  document.getElementById('viewParametres').style.display = view === 'parametres' ? '' : 'none';
  document.getElementById('viewCaisse').style.display = view === 'caisse' ? '' : 'none';
  document.getElementById('navClients').classList.toggle('active', view === 'clients');
  document.getElementById('navParametres').classList.toggle('active', view === 'parametres');
  document.getElementById('navCaisse').classList.toggle('active', view === 'caisse');
  document.getElementById('caisseBottomTabs').classList.toggle('show', view === 'caisse');
  document.body.classList.toggle('has-bottom-tabs', view === 'caisse');
  closeNav();

  if (view === 'parametres'){
    renderParamTabs();
    selectParamType(currentParamType);
  }
  if (view === 'caisse'){
    renderCaisseClientList(clients);
    renderPrestationList();
    renderCart();
    selectCaisseTab(caisseTab);
  }
}

// ---------- Paramètres (races, prestations...) ----------
const TYPE_CONFIG = {
  Race: { parentType: 'Espece', priceField: false },
  Prestation: { parentType: null, priceField: true }
};
let currentParamType = 'Race';

function renderParamTabs(){
  const wrap = document.getElementById('paramTabs');
  wrap.innerHTML = Object.keys(TYPE_CONFIG).map(t =>
    `<button class="tab-btn ${t === currentParamType ? 'active' : ''}" onclick="selectParamType('${t}')">${t}</button>`
  ).join('');
}

function selectParamType(type){
  currentParamType = type;
  renderParamTabs();
  renderParamList();

  const cfg = TYPE_CONFIG[type];
  document.getElementById('paramParentRow').style.display = cfg.parentType ? '' : 'none';
  document.getElementById('paramPriceRow').style.display = cfg.priceField ? '' : 'none';
  if (cfg.parentType){
    const options = parametres.filter(p => p.Type === cfg.parentType).map(p => p.Valeur);
    fillSelect(document.getElementById('paramParentSelect'), options, 'Sélectionner');
  }
  document.getElementById('paramValueInput').value = '';
  document.getElementById('paramPriceInput').value = '';
}

function renderParamList(){
  const items = parametres.filter(p => p.Type === currentParamType);
  const list = document.getElementById('paramList');

  if (!items.length){
    list.innerHTML = '<div class="meta" style="color:var(--ink-soft);font-size:0.85rem;padding:8px 0;">Aucune valeur pour l\'instant.</div>';
    return;
  }

  list.innerHTML = items.map(p => `
    <div class="param-item">
      <div>
        <div class="val">${p.Valeur}${p.Prix ? ` — ${Number(p.Prix).toFixed(2)} €` : ''}</div>
        ${p.Parent ? `<div class="sub">${p.Parent}</div>` : ''}
      </div>
      <button class="btn-delete" onclick="deleteParamItem('${p.ID}')">✕</button>
    </div>
  `).join('');
}

async function reloadParametres(){
  parametres = await apiGet('getParametres');
}

async function addParamItem(){
  const valeur = document.getElementById('paramValueInput').value.trim();
  if (!valeur){ toast('Entre une valeur'); return; }

  const cfg = TYPE_CONFIG[currentParamType];
  const parent = cfg.parentType ? document.getElementById('paramParentSelect').value : '';
  if (cfg.parentType && !parent){ toast('Choisis ' + cfg.parentType); return; }
  const prix = cfg.priceField ? document.getElementById('paramPriceInput').value : '';

  toast('Ajout...');
  const res = await apiPost('addParametre', { Type: currentParamType, Valeur: valeur, Parent: parent, Prix: prix });
  if (res.error){ toast('Erreur : ' + res.error); return; }

  document.getElementById('paramValueInput').value = '';
  document.getElementById('paramPriceInput').value = '';
  toast('Ajouté ✓');
  await reloadParametres();
  renderParamList();
}

async function deleteParamItem(id){
  if (!confirm('Supprimer cette valeur ?')) return;

  toast('Suppression...');
  const res = await apiPost('deleteParametre', { ID: id });
  if (res.error){ toast('Erreur : ' + res.error); return; }

  toast('Supprimé ✓');
  await reloadParametres();
  renderParamList();
}

// ---------- Events ----------
document.getElementById('btnMenu').addEventListener('click', openNav);
document.getElementById('navOverlay').addEventListener('click', (e) => { if (e.target.id === 'navOverlay') closeNav(); });
document.getElementById('btnAddParam').addEventListener('click', addParamItem);
document.getElementById('btnNewClient').addEventListener('click', openClientModal);

// ---------- Caisse ----------
let cart = [];
let caisseClient = null;
let caisseTab = 'client';

function selectCaisseTab(tab){
  caisseTab = tab;
  document.querySelectorAll('#caisseBottomTabs button').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
  document.getElementById('caisseTabClient').style.display = tab === 'client' ? '' : 'none';
  document.getElementById('caisseTabPrestation').style.display = tab === 'prestation' ? '' : 'none';
  document.getElementById('caisseTabAutre').style.display = tab === 'autre' ? '' : 'none';
}

function renderCaisseClientList(list){
  const container = document.getElementById('caisseClientList');
  if (!list.length){
    container.innerHTML = '<div class="meta" style="color:var(--ink-soft);font-size:0.85rem;">Aucun client.</div>';
    return;
  }
  container.innerHTML = list.map(cl => `
    <div class="caisse-client-card" onclick="selectCaisseClient('${cl.ID_Client}')">
      <div class="name">${cl.Prenom || ''} ${cl.Nom || ''}</div>
      <div class="meta">${cl.Telephone || ''}</div>
    </div>
  `).join('');
}

document.getElementById('caisseClientSearch').addEventListener('input', (e) => {
  const q = e.target.value.trim().toLowerCase();
  const filtered = !q ? clients : clients.filter(c =>
    (c.Nom || '').toLowerCase().includes(q) ||
    (c.Prenom || '').toLowerCase().includes(q) ||
    (c.Telephone || '').toLowerCase().includes(q)
  );
  renderCaisseClientList(filtered);
});

function selectCaisseClient(idClient){
  const cl = clients.find(c => c.ID_Client === idClient);
  if (!cl) return;
  caisseClient = cl;

  document.getElementById('caisseSelectedClientName').textContent = `${cl.Prenom || ''} ${cl.Nom || ''}`.trim();
  document.getElementById('caisseSelectedClientBar').style.display = 'flex';
  document.getElementById('caisseClientSearchWrap').style.display = 'none';
  document.getElementById('caisseClientList').style.display = 'none';

  selectCaisseTab('prestation');
}

function clearCaisseClient(){
  caisseClient = null;
  document.getElementById('caisseSelectedClientBar').style.display = 'none';
  document.getElementById('caisseClientSearchWrap').style.display = '';
  document.getElementById('caisseClientList').style.display = '';
  selectCaisseTab('client');
}

function renderPrestationList(){
  const prestations = parametres.filter(p => p.Type === 'Prestation');
  const container = document.getElementById('prestationList');

  if (!prestations.length){
    container.innerHTML = '<div class="meta" style="color:var(--ink-soft);font-size:0.85rem;">Aucune prestation configurée (menu Paramètres).</div>';
    return;
  }

  container.innerHTML = prestations.map(p => `
    <div class="prestation-card" onclick='addPrestationToCart(${JSON.stringify(p.Valeur)}, ${Number(p.Prix) || 0})'>
      <span class="p-name">${p.Valeur}</span>
      <span class="p-price">${p.Prix ? Number(p.Prix).toFixed(2) + ' €' : '—'}</span>
    </div>
  `).join('');
}

function addPrestationToCart(libelle, prix){
  cart.push({ Type: 'Prestation', Libelle: libelle, Prix: Number(prix) || 0, Quantite: 1 });
  renderCart();
  toast('Ajouté au panier');
}

document.getElementById('btnAddAutre').addEventListener('click', () => {
  const libelle = document.getElementById('autreLibelle').value.trim();
  const prix = parseFloat(document.getElementById('autrePrix').value) || 0;
  const qte = parseInt(document.getElementById('autreQte').value, 10) || 1;

  if (!libelle){ toast('Entre un libellé'); return; }

  cart.push({ Type: 'Autre', Libelle: libelle, Prix: prix, Quantite: qte });
  document.getElementById('autreLibelle').value = '';
  document.getElementById('autrePrix').value = '';
  document.getElementById('autreQte').value = '1';
  renderCart();
  toast('Ajouté au panier');
});

function renderCart(){
  const container = document.getElementById('cartItems');
  const emptyMsg = document.getElementById('cartEmpty');

  if (!cart.length){
    container.innerHTML = '';
    emptyMsg.style.display = '';
    document.getElementById('cartTotal').textContent = '0.00 €';
    return;
  }

  emptyMsg.style.display = 'none';
  container.innerHTML = cart.map((item, idx) => `
    <div class="cart-item">
      <span class="libelle">${item.Libelle}</span>
      <input type="number" class="cart-prix" step="0.5" min="0" value="${item.Prix}" onchange="updateCartPrix(${idx}, this.value)">
      <input type="number" class="cart-qte" min="1" value="${item.Quantite}" onchange="updateCartQte(${idx}, this.value)">
      <button class="btn-delete" onclick="removeCartItem(${idx})">✕</button>
    </div>
  `).join('');

  const total = cart.reduce((sum, i) => sum + (i.Prix * i.Quantite), 0);
  document.getElementById('cartTotal').textContent = total.toFixed(2) + ' €';
}

function updateCartPrix(idx, val){ cart[idx].Prix = parseFloat(val) || 0; renderCart(); }
function updateCartQte(idx, val){ cart[idx].Quantite = parseInt(val, 10) || 1; renderCart(); }
function removeCartItem(idx){ cart.splice(idx, 1); renderCart(); }

document.getElementById('btnEncaisser').addEventListener('click', () => {
  if (!cart.length){ toast('Le panier est vide'); return; }
  const total = cart.reduce((sum, i) => sum + (i.Prix * i.Quantite), 0);
  document.getElementById('paiementTotal').textContent = total.toFixed(2) + ' €';
  document.getElementById('overlayPaiement').classList.add('show');
});

document.getElementById('btnCancelPaiement').addEventListener('click', () => {
  document.getElementById('overlayPaiement').classList.remove('show');
});

document.getElementById('btnConfirmPaiement').addEventListener('click', async () => {
  const total = cart.reduce((sum, i) => sum + (i.Prix * i.Quantite), 0);
  const moyen = document.getElementById('paiementMoyen').value;

  const data = {
    ID_Client: caisseClient ? caisseClient.ID_Client : '',
    Client_Nom: caisseClient ? `${caisseClient.Prenom || ''} ${caisseClient.Nom || ''}`.trim() : '',
    Total: total,
    Moyen_Paiement: moyen,
    Lignes: cart
  };

  toast('Encaissement...');
  const res = await apiPost('addVente', data);
  if (res.error){ toast('Erreur : ' + res.error); return; }

  document.getElementById('overlayPaiement').classList.remove('show');
  toast('Vente enregistrée ✓');
  cart = [];
  clearCaisseClient();
  renderCart();
});
document.getElementById('btnCancelClient').addEventListener('click', closeClientModal);
document.getElementById('btnSaveClient').addEventListener('click', saveClient);
document.getElementById('btnCancelAnimal').addEventListener('click', closeAnimalModal);
document.getElementById('btnSaveAnimal').addEventListener('click', saveAnimal);
document.getElementById('aEspece').addEventListener('change', refreshRaceOptions);

loadAll();
</script>
</body>
</html>
